<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXI 고객 웹사이트 발급</title><style>:root{color-scheme:dark;font-family:system-ui}body{margin:0;background:#10182a;color:white}main{max-width:850px;margin:30px auto;padding:16px}section{background:#1b2940;padding:22px;border-radius:14px;margin:18px 0}a{color:#bafa94}input,select,button{font:inherit}input:not([type=checkbox]),select{display:block;width:100%;box-sizing:border-box;background:#0c1729;color:#fff;border:1px solid #53617b;border-radius:9px;padding:10px;margin-top:6px}label{display:block;margin:12px 0}button{background:#bafa94;border:0;border-radius:9px;padding:10px 14px;margin:8px 6px 6px 0;cursor:pointer}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px}.checks label{padding:5px}.card{padding:12px;border:1px solid #53617b;margin:10px 0;border-radius:10px}.muted{color:#bdc6d6}#message{color:#bafa94}</style></head><body><main><p><a href="/admin">← 기존 NEXI 총관리자</a></p><h1>고객별 채팅방 관리자 웹사이트</h1><p class="muted">고객 웹사이트는 선택한 방에만 접근할 수 있습니다.</p><p id="message"></p><section><h2>웹사이트 발급 · 권한 변경</h2><form id="create"><label>봇 참여 채팅방<select id="room" required></select></label><label>웹사이트 이름<input id="label" maxlength="60" required placeholder="예: 발로란트 학교 관리자"></label><label>고객 로그인 아이디<input id="username" required minlength="4" maxlength="40" pattern="[a-zA-Z0-9_.-]+" autocomplete="off"></label><label>고객 비밀번호<input id="password" type="password" minlength="10" autocomplete="new-password" placeholder="기존 사이트 수정 시 비워두면 유지"></label><h3>사용 허용할 기능</h3><div class="checks" id="permissions"></div><label><input id="enabled" type="checkbox" checked> 고객 웹사이트 사용 허용</label><label><input id="revoke" type="checkbox"> 기존 고객 로그인 세션 모두 종료</label><button>고객 웹사이트 생성 / 변경사항 저장</button></form></section><section><h2>발급된 웹사이트</h2><div id="list"></div></section></main><script src="/admin/room-portals.js" defer></script></body></html>
