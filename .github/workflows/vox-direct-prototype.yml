name: Direct VOX protocol prototype checks
on:
  pull_request:
    paths:
      - 'shared/voice-room-direct-protocol.js'
      - 'shared/vox30-protocol.js'
      - 'shared/vox30-adapter.js'
      - 'shared/vox30-existing-auth.js'
      - 'test/voice-room-direct-protocol.test.js'
      - 'test/vox30-protocol.test.js'
      - 'test/vox30-lab.test.js'
      - 'test/vox30-existing-auth.test.js'
      - 'experiments/vox30/**'
      - '.github/workflows/vox-direct-prototype.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing root lockfile dependencies
        run: npm ci --ignore-scripts
      - name: Install pinned lab dependencies separately from production
        run: npm install --prefix experiments/vox30 --ignore-scripts --no-audit --no-fund
      - name: Test direct VOX framing, SEED-CBC, WebRTC and transport
        run: node --test test/voice-room-direct-protocol.test.js test/vox30-protocol.test.js test/vox30-lab.test.js test/vox30-existing-auth.test.js
