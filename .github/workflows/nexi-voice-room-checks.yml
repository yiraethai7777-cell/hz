name: NEXI voice-room checks
on:
  push:
    branches:
      - main
      - feature/nexi-voice-room-controls-20261108
  pull_request:
    branches: [main]
    paths:
      - 'shared/voice-room.js'
      - 'shared/vox30-participation.js'
      - 'shared/vox30-adapter.js'
      - 'shared/vox30-role-state.js'
      - 'shared/voice-room-observer.js'
      - 'shared/voice-room-join-info.js'
      - 'shared/voice-room-vox-wire.js'
      - 'shared/voice-room-vox-transport.js'
      - 'shared/voice-room-vox-membership.js'
      - 'shared/voice-room-auto-detect.js'
      - 'hz-new.js'
      - 'shared/router.js'
      - 'test/voice-*.test.js'
      - '.github/workflows/nexi-voice-room-checks.yml'
permissions:
  contents: read
jobs:
  voice-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check experiments/voice-room/frida-vox-observe.js
      - run: node --test test/vox30-role-state.test.js
      - run: node --test test/vox30-participation.test.js
      - run: node --test test/voice-room.test.js test/voice-router.test.js test/voice-room-observer.test.js test/voice-room-auto-detect.test.js test/voice-room-join-info.test.js test/voice-room-frida-observe.test.js test/vox30-role-state.test.js
      # SEED-CBC is in OpenSSL's legacy provider. Scope it to this test subprocess.
      # Never change NODE_OPTIONS on the running KakaoForge/Railway bot.
      - run: node --openssl-legacy-provider --test test/voice-room-vox-wire.test.js test/voice-room-vox-transport.test.js test/voice-room-vox-membership.test.js
