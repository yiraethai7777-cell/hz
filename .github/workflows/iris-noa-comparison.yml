name: Iris Noa comparison tests
on:
  push:
    branches: [main]
    paths:
      - 'shared/voice-room-iris-commands.js'
      - 'shared/voice-room-noa-bridge.js'
      - 'shared/voice-room.js'
      - 'shared/voice-room-permission.js'
      - 'shared/router.js'
      - 'hz-new.js'
      - 'test/voice-room-iris-commands.test.js'
      - 'test/voice-room-noa-bridge.test.js'
      - 'test/voice-router.test.js'
      - 'test/voice-room-permission.test.js'
      - 'test/voice-direct-only-mode.test.js'
      - '.github/workflows/iris-noa-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test test/voice-room-iris-commands.test.js test/voice-room-noa-bridge.test.js test/voice-router.test.js test/voice-room-permission.test.js test/voice-direct-only-mode.test.js
