<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXI 방 관리자</title><link rel="stylesheet" href="/room-panel/style.css"></head><body><main><header><h1>🛡️ NEXI · 방 관리자</h1><p id="subtitle" class="muted"></p></header><p id="notice" role="status"></p>
<section id="login"><h2>고객 로그인</h2><form id="loginForm"><label>아이디<input name="username" required autocomplete="username"></label><label>비밀번호<input name="password" type="password" required autocomplete="current-password"></label><button>로그인</button></form></section>
<div id="app" hidden><nav class="tabs"><button id="tabSettings" type="button">설정</button><button id="tabMembers" type="button" class="secondary">👥 인원</button><button id="tabRanks" type="button" class="secondary">📊 채팅순위</button></nav><div id="settingsView"><button id="logout" class="secondary">로그아웃</button><section><h2>기능 관리</h2><div id="features"></div></section><section id="prefixPanel" hidden><h2>명령어 접두사</h2><p class="muted">쉼표 또는 줄바꿈으로 최대 5개까지 입력할 수 있습니다. 설정에서 !를 제외하면 ! 명령어는 더 이상 작동하지 않습니다.</p><form id="prefixForm"><label>사용할 접두사<input id="prefixInput" maxlength="40" placeholder="예: >, ?, ."></label><button>접두사 저장</button></form></section><section id="templates" hidden><h2>입장·퇴장 문구</h2><form id="templateForm"><label>입장 메시지<textarea id="joinTemplate" maxlength="2000"></textarea></label><label>퇴장 메시지<textarea id="leaveTemplate" maxlength="2000"></textarea></label><button>문구 저장</button></form></section><section id="warningPanel" hidden><h2>경고 관리</h2><form id="warnForm"><label>카카오 사용자 ID<input id="userId" inputmode="numeric" pattern="[1-9][0-9]*" required></label><label>사용자 이름<input id="userName" maxlength="80"></label><label>경고 사유<input id="reason" maxlength="300" required></label><label>경고 개수<input id="warnCount" type="number" min="1" max="10" value="1" required></label><button>경고 지급</button></form><h3>현재 경고 내역</h3><div id="warnings"></div></section><section><h2>로그인 정보 변경</h2><p class="muted">변경 후 모든 기기에서 로그아웃됩니다.</p><form id="accountForm"><label>새 아이디<input id="newUsername" required minlength="4" maxlength="40" pattern="[a-zA-Z0-9_.-]+" autocomplete="username"></label><label>현재 비밀번호<input id="currentPassword" type="password" required autocomplete="current-password"></label><label>새 비밀번호 (변경하지 않으면 비워두세요)<input id="newPassword" type="password" minlength="10" autocomplete="new-password"></label><button>로그인 정보 변경</button></form></section></div><section id="membersView" hidden><h2>👥 방 인원 <span id="memberCount"></span></h2><p id="memberChecked" class="muted"></p><button id="reloadMembers" type="button">인원 새로고침</button><input id="memberSearch" placeholder="이름 또는 아이디 검색" autocomplete="off"><div id="memberList"></div></section><section id="ranksView" hidden><h2>📊 채팅순위</h2><p class="muted">현재 방의 전체 채팅순위와 누적 채팅 횟수를 보여줍니다.</p><button id="reloadRanks" type="button">순위 새로고침</button><button id="resetRanks" type="button" class="danger">전체 채팅 기록 초기화</button><p id="ranksSummary" class="muted"></p><input id="rankSearch" placeholder="닉네임 또는 아이디 검색"><h3>전체 채팅순위</h3><div id="rankList"></div></section></div>
</main><script src="/room-panel/app.js" defer></script></body></html>
