<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXI 방 관리자</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}body{background:#0b1020;color:#edf2ff;margin:0}main{max-width:850px;margin:auto;padding:28px 16px}h1{font-size:24px}h2{font-size:18px}section{border:1px solid #2c3854;background:#141d31;border-radius:16px;padding:20px;margin:16px 0}label{display:block;margin:12px 0;font-size:14px}input,textarea,button{font:inherit}input:not([type=checkbox]),textarea{display:block;box-sizing:border-box;width:100%;background:#091324;color:#fff;border:1px solid #465471;border-radius:10px;padding:12px;margin:6px 0}textarea{min-height:110px}button{background:#a5fa7b;color:#112018;border:0;border-radius:9px;padding:10px 14px;margin:5px 5px 5px 0;cursor:pointer;font-weight:650}button.secondary{background:#38465e;color:#fff}button:disabled{opacity:.5}.feature{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #303c53;padding:12px 0}.feature input{width:22px;height:22px}.muted{color:#a4b2c9}.warn{padding:10px;border:1px solid #3b4c66;border-radius:9px;margin:7px 0}.error{color:#ffb1a8}#notice{min-height:20px}
</style></head><body><main><header><h1>🛡️ NEXI · 방 관리자</h1><p id="subtitle" class="muted"></p></header><p id="notice" role="status"></p>
<section id="login"><h2>고객 로그인</h2><form id="loginForm"><label>아이디<input name="username" required autocomplete="username"></label><label>비밀번호<input name="password" type="password" required autocomplete="current-password"></label><button>로그인</button></form></section>
<div id="app" hidden><button id="logout" class="secondary">로그아웃</button><section><h2>기능 관리</h2><div id="features"></div></section><section id="templates" hidden><h2>입장·퇴장 문구</h2><form id="templateForm"><label>입장 메시지<textarea id="joinTemplate" maxlength="2000"></textarea></label><label>퇴장 메시지<textarea id="leaveTemplate" maxlength="2000"></textarea></label><button>문구 저장</button></form></section><section id="warningPanel" hidden><h2>경고 관리</h2><form id="warnForm"><label>카카오 사용자 ID<input id="userId" inputmode="numeric" pattern="[1-9][0-9]*" required></label><label>사용자 이름<input id="userName" maxlength="80"></label><label>경고 사유<input id="reason" maxlength="300" required></label><button>경고 지급</button></form><h3>현재 경고 내역</h3><div id="warnings"></div></section></div>
</main><script src="/room-panel/app.js" defer></script></body></html>
