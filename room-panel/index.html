<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXI 방 관리자</title><link rel="stylesheet" href="/room-panel/style.css"></head><body><main><header><h1>🛡️ NEXI · 방 관리자</h1><p id="subtitle" class="muted"></p></header><p id="notice" role="status"></p>
<section id="login"><h2>고객 로그인</h2><form id="loginForm"><label>아이디<input name="username" required autocomplete="username"></label><label>비밀번호<input name="password" type="password" required autocomplete="current-password"></label><button>로그인</button></form></section>
<div id="app" hidden><button id="logout" class="secondary">로그아웃</button><section><h2>기능 관리</h2><div id="features"></div></section><section id="templates" hidden><h2>입장·퇴장 문구</h2><form id="templateForm"><label>입장 메시지<textarea id="joinTemplate" maxlength="2000"></textarea></label><label>퇴장 메시지<textarea id="leaveTemplate" maxlength="2000"></textarea></label><button>문구 저장</button></form></section><section id="warningPanel" hidden><h2>경고 관리</h2><form id="warnForm"><label>카카오 사용자 ID<input id="userId" inputmode="numeric" pattern="[1-9][0-9]*" required></label><label>사용자 이름<input id="userName" maxlength="80"></label><label>경고 사유<input id="reason" maxlength="300" required></label><button>경고 지급</button></form><h3>현재 경고 내역</h3><div id="warnings"></div></section><section><h2>로그인 정보 변경</h2><p class="muted">변경 후 모든 기기에서 로그아웃됩니다.</p><form id="accountForm"><label>새 아이디<input id="newUsername" required minlength="4" maxlength="40" pattern="[a-zA-Z0-9_.-]+" autocomplete="username"></label><label>현재 비밀번호<input id="currentPassword" type="password" required autocomplete="current-password"></label><label>새 비밀번호 (변경하지 않으면 비워두세요)<input id="newPassword" type="password" minlength="10" autocomplete="new-password"></label><button>로그인 정보 변경</button></form></section></div>
</main><script src="/room-panel/app.js" defer></script></body></html>
